<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NR Rvibe Lead Extractor</title>
  <style>
    body { width: 380px; margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; }
    h1 { font-size: 16px; color: #38bdf8; margin-top: 0; display: flex; align-items: center; justify-content: space-between; }
    .btn { width: 100%; background: #06b6d4; color: #0f172a; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    .btn:hover { background: #22d3ee; }
    .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    .card { background: #1e293b; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; border: 1px solid #334155; }
    .status { font-size: 12px; padding: 12px; border-radius: 8px; margin-top: 10px; display: none; }
    .status.success { display: block; background: #064e3b; color: #a7f3d0; border: 1px solid #047857; }
    .status.info { display: block; background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    
    /* Progress Bar */
    .progress-bar-container { background: #334155; border-radius: 9999px; height: 8px; width: 100%; margin-top: 8px; overflow: hidden; display: none; }
    .progress-bar { background: #38bdf8; height: 100%; width: 0%; transition: width 0.3s ease; }
    
    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; display: none; }
    .stat-badge { background: #0f172a; padding: 8px; border-radius: 6px; text-align: center; font-size: 11px; border: 1px solid #1e293b; }
    .stat-val { font-weight: bold; color: #22d3ee; font-size: 14px; margin-top: 4px; }
    /* Added styles */
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 11px; margin-bottom: 4px; color: #94a3b8; }
    .input-group select, .input-group input { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 6px 8px; border-radius: 4px; font-size: 12px; }
    .input-group select:focus, .input-group input:focus { outline: none; border-color: #06b6d4; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-secondary:hover { background: #475569; }
    .btn-danger { background: #e11d48; color: white; }
    .btn-danger:hover { background: #be123c; }
    .btn-success { background: #10b981; color: #0f172a; }
    .btn-success:hover { background: #059669; }
    .flex-row { display: flex; gap: 8px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>NR Rvibe Extractor <span>v1.0</span></h1>
  
  <div class="card" id="settingsCard">
    <div class="input-group">
      <label>Google Apps Script Web App URL</label>
      <input type="text" id="webAppUrl" placeholder="Enter URL or leave blank to use default">
    </div>
    <div class="input-group">
      <label>Scraping Speed</label>
      <select id="scrapeSpeed">
        <option value="safe">Safe Mode (Slower, avoids bans)</option>
        <option value="fast">Fast Mode (Max speed)</option>
      </select>
    </div>
    <button id="saveSettingsBtn" class="btn btn-secondary" style="padding: 6px; font-size: 11px; margin-top: 4px;">Save Settings</button>
  </div>

  <button id="extractBtn" class="btn">Extract Leads from Active Maps List</button>
  <button id="stopBtn" class="btn btn-danger" style="display: none;">Stop Extraction</button>
  <button id="syncStoppedBtn" class="btn btn-success" style="display: none;">Sync Scraped Leads to Sheets & CRM</button>
  
  <div class="flex-row">
    <button id="openCrmBtn" class="btn btn-secondary" style="margin-top: 0;">Open CRM</button>
    <button id="clearCacheBtn" class="btn btn-secondary" style="margin-top: 0; background: #94a3b8; color: #0f172a;">Clear Cache</button>
  </div>
  
  <div id="statusBox" class="status">
    <div id="statusHeader" style="font-weight: bold; color: #38bdf8; font-size: 13px; margin-bottom: 4px;">Initializing...</div>
    <div id="statusText" style="color: #94a3b8; font-size: 11px; margin-bottom: 6px; line-height: 1.4;"></div>
    
    <div id="progressBarContainer" class="progress-bar-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    
    <div id="statsGrid" class="stats-grid">
      <div class="stat-badge">
        <div>📞 Phone</div>
        <div id="statPhones" class="stat-val">0</div>
      </div>
      <div class="stat-badge">
        <div>🌐 Website</div>
        <div id="statWebsites" class="stat-val">0</div>
      </div>
      <div class="stat-badge">
        <div>📧 Socials</div>
        <div id="statSocials" class="stat-val">0</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
